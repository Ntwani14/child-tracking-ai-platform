# Application
spring.application.name=child-tracking-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/child_tracking_db
spring.datasource.username=postgres
# Set this as environment variable DB_PASSWORD or replace for local dev
spring.datasource.password=${DB_PASSWORD:postgres29}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=3d6f4b8c1e9a2f7d5c0b3e8a4f1d9c6b2e5a8f3d7c0b4e1a9f6d3c8b5e2a7f4
jwt.expiration=86400000

# AI Service
ai.service.url=http://localhost:8000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/images
