# Application
spring.application.name=child-tracking-backend
spring.config.import=optional:classpath:application-local.properties
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/child_tracking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres29}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:3d6f4b8c1e9a2f7d5c0b3e8a4f1d9c6b2e5a8f3d7c0b4e1a9f6d3c8b5e2a7f4}
jwt.expiration=86400000

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${UPLOAD_DIR:uploads/images}

# Frontend URL (used in email links)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Email Notifications (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${MAIL_FROM:noreply@childtracking.co.za}
app.email.from-name=${MAIL_FROM_NAME:MCRS Alerts}