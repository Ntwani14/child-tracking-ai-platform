<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Missing Children Reporting System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-logo">
            <h1>🔍 Missing Children</h1>
            <p>Reporting & Tracking System</p>
        </div>

        <div class="auth-card">
            <h2>Sign In</h2>
            <p class="auth-subtitle">Enter your credentials to access the system</p>

            <div id="error-message" class="alert alert-error hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                    Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('login-btn');

            btn.textContent = 'Signing in...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token and user info to localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userName', data.fullName);
                    localStorage.setItem('userRole', data.role);
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password';
                    errorDiv.classList.remove('hidden');
                    btn.textContent = 'Sign In';
                    btn.disabled = false;
                }
            } catch (err) {
                errorDiv.textContent = 'Could not connect to the server. Make sure the backend is running.';
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
