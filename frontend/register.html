<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Missing Children Reporting System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-logo">
            <h1>🔍 Missing Children</h1>
            <p>Reporting & Tracking System</p>
        </div>

        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the community to report and track missing children</p>

            <div id="error-message" class="alert alert-error hidden"></div>
            <div id="success-message" class="alert alert-success hidden"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="location">Your Area <span class="optional">(for alert notifications)</span></label>
                    <input type="text" id="location" name="location" placeholder="e.g. Soshanguve, Pretoria">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="register-btn">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const location = document.getElementById('location').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const btn = document.getElementById('register-btn');

            btn.textContent = 'Creating account...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('http://localhost:8080/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password, location })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userName', data.fullName);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Registration failed. Please try again.';
                    errorDiv.classList.remove('hidden');
                    btn.textContent = 'Create Account';
                    btn.disabled = false;
                }
            } catch (err) {
                errorDiv.textContent = 'Could not connect to the server. Make sure the backend is running.';
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
